name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: 'v2.14.0'

      - name: Test
        run: go test -v -coverprofile=coverage.out ./...

      - name: Coverage Check
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_ENABLED: >-
            ${{ github.event_name == 'pull_request' &&
                github.event.pull_request.head.repo.full_name == github.repository &&
                github.actor != 'dependabot[bot]' }}
          COMMENT_REPOSITORY: ${{ github.repository }}
          COMMENT_PR: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p .agents
          go build -o .agents/go-covercheck ./cmd/go-covercheck
          args=(coverage.out -C v0.6.1 --comment="$COMMENT_ENABLED")
          if [[ "$COMMENT_ENABLED" == "true" ]]; then
            args+=(
              --comment-platform github
              --comment-base-url https://github.com
              --comment-repository "$COMMENT_REPOSITORY"
              --comment-pr "$COMMENT_PR"
              --comment-update
              --comment-author 'github-actions[bot]'
            )
          fi
          .agents/go-covercheck "${args[@]}"

      - name: Build
        run: go build -v ./...

      - name: Build Docker Image
        run: docker build -t go-covercheck .
