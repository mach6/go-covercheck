name: Test go-covercheck action

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'action.yml'
      - '.github/workflows/test-action.yml'

permissions:
  contents: read

jobs:
  test-action:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Generate coverage
        run: go test -coverprofile=coverage.out ./...

      - name: Basic usage
        uses: ./
        with:
          coverage-file: coverage.out
          version: ${{ github.sha }}

      - name: Thresholds, format and skip patterns
        uses: ./
        with:
          coverage-file: coverage.out
          statement-threshold: "50"
          block-threshold: "50"
          format: json
          skip: "samples,testdata"
          no-color: "true"
          version: ${{ github.sha }}

      - name: Missing coverage file fails
        id: missing
        continue-on-error: true
        uses: ./
        with:
          coverage-file: does-not-exist.out
          version: ${{ github.sha }}

      - name: Verify missing file failed
        if: steps.missing.outcome != 'failure'
        run: |
          echo "expected the missing coverage file step to fail"
          exit 1
