style: github
template: CHANGELOG.tpl.md
info:
  title: CHANGELOG
  repository_url: https://github.com/mach6/go-covercheck
options:
  commits:
    # Only the changes users can see. This leaves out dependency and CI bumps from dependabot
    # (deps, ci, docker), which are not worth a line in the notes.
    filters:
      Type:
        - feat
        - fix
        - perf
        - refactor
  commit_groups:
    # title_maps:
    #   feat: Features
    #   fix: Bug Fixes
    #   perf: Performance Improvements
    #   refactor: Code Refactoring
  header:
    pattern: "^(\\w*)(?:\\(([\\w\\$\\.\\-\\*\\s]*)\\))?(?:!)?\\:\\s(.*)$"
    pattern_maps:
      - Type
      - Scope
      - Subject
  notes:
    keywords:
      - BREAKING CHANGE